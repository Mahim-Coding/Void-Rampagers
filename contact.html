<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Void-Rampagers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0e17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 650px;
        }

        /* Form Card with subtle orange-amber glow */
        .contact-card {
            background-color: #161829;
            border: 1px solid rgba(255, 115, 36, 0.35);
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 0 35px rgba(255, 107, 0, 0.14);
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: #f5b014;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        label span {
            color: #ff4d4d;
        }

        input, textarea {
            width: 100%;
            background-color: #252942;
            border: 1px solid #3c4266;
            border-radius: 8px;
            padding: 13px 15px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input::placeholder, textarea::placeholder {
            color: #8b92b2;
        }

        input:focus, textarea:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .helper-text {
            display: block;
            color: #8b92b2;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        /* Orange Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #ff5e00, #ff7300);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.45);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #statusMsg {
            text-align: center;
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #8b92b2;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #f5b014;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <a href="index.html" class="back-link">← Back to Home</a>

        <form id="contactForm">
            <!-- আপনার গোপন Access Key এখানে বসান (আপনার ইমেইল হাইড থাকবে) -->
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
            <input type="hidden" name="from_name" value="Void-Rampagers Contact">

            <div class="contact-card">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Your Email <span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    <span class="helper-text">Where we'll send our reply</span>
                </div>

                <!-- Subject Field -->
                <div class="form-group">
                    <label for="subject">Subject <span>*</span></label>
                    <input type="text" id="subject" name="subject" placeholder="Briefly describe your issue" required>
                    <span class="helper-text">Briefly describe your issue</span>
                </div>

                <!-- Message Field -->
                <div class="form-group">
                    <label for="message">Message <span>*</span></label>
                    <textarea id="message" name="message" maxlength="500" placeholder="Describe your question or problem in detail..." required></textarea>
                    <span class="helper-text" id="charCount">0/500 characters</span>
                </div>
            </div>

            <!-- Send Button -->
            <button type="submit" class="submit-btn" id="submitBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                Send Message
            </button>

            <div id="statusMsg"></div>
        </form>
    </div>

    <script>
        // Live Character Counter (0/500)
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');

        messageInput.addEventListener('input', () => {
            charCount.textContent = `${messageInput.value.length}/500 characters`;
        });

        // Form Submission without exposing your email
        const form = document.getElementById('contactForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Sending...';
            statusMsg.textContent = '';

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: json
                });
                const result = await response.json();

                if (response.status === 200) {
                    statusMsg.style.color = '#4ade80';
                    statusMsg.textContent = '✓ Message sent successfully! We will reply to your email soon.';
                    form.reset();
                    charCount.textContent = '0/500 characters';
                } else {
                    statusMsg.style.color = '#f87171';
                    statusMsg.textContent = result.message || 'Something went wrong. Please try again.';
                }
            } catch (error) {
                statusMsg.style.color = '#f87171';
                statusMsg.textContent = 'Network error. Please check your connection.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    Send Message`;
            }
        });
    </script>

</body>
</html>
