<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Void-Rampagers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0e17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .wrapper {
            width: 100%;
            max-width: 650px;
        }

        .contact-card {
            background-color: #161829;
            border: 1px solid rgba(255, 115, 36, 0.35);
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 0 35px rgba(255, 107, 0, 0.14);
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: #f5b014;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        label span {
            color: #ff4d4d;
        }

        input, textarea {
            width: 100%;
            background-color: #252942;
            border: 1px solid #3c4266;
            border-radius: 8px;
            padding: 13px 15px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input::placeholder, textarea::placeholder {
            color: #8b92b2;
        }

        input:focus, textarea:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .helper-text {
            display: block;
            color: #8b92b2;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #ff5e00, #ff7300);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.45);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #errorMsg {
            text-align: center;
            margin-top: 15px;
            font-size: 0.95rem;
            color: #f87171;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #8b92b2;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #f5b014;
        }

        /* Confirmation Popup Modal */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .popup-box {
            background: #161829;
            border: 1px solid #f5b014;
            border-radius: 14px;
            max-width: 430px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 0 40px rgba(245, 176, 20, 0.25);
            animation: scaleUp 0.25s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.88); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .check-circle {
            width: 64px;
            height: 64px;
            background: rgba(74, 222, 128, 0.15);
            border: 2px solid #4ade80;
            color: #4ade80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 18px;
        }

        .popup-box h2 {
            color: #ffffff;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .popup-box p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .popup-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .another-btn {
            background: linear-gradient(90deg, #ff5e00, #ff7300);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .another-btn:hover {
            opacity: 0.92;
        }

        .home-btn {
            background: #252942;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .home-btn:hover {
            background: #313657;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <a href="index.html" class="back-link">← Back to Home</a>

        <form id="contactForm">
            <!-- নিচের value-তে আপনার Web3Forms Access Key বসান -->
            <input type="hidden" name="access_key" id="accessKey" value="52758410-4656-4edc-9018-441c14438528">
            <input type="hidden" name="from_name" value="Void-Rampagers Contact">

            <div class="contact-card">
                <div class="form-group">
                    <label for="email">Your Email <span>*</span></label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    <span class="helper-text">Where we'll send our reply</span>
                </div>

                <div class="form-group">
                    <label for="subject">Subject <span>*</span></label>
                    <input type="text" id="subject" name="subject" placeholder="Briefly describe your issue" required>
                    <span class="helper-text">Briefly describe your issue</span>
                </div>

                <div class="form-group">
                    <label for="message">Message <span>*</span></label>
                    <textarea id="message" name="message" maxlength="500" placeholder="Describe your question or problem in detail..." required></textarea>
                    <span class="helper-text" id="charCount">0/500 characters</span>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                Send Message
            </button>

            <div id="errorMsg"></div>
        </form>
    </div>

    <!-- Confirmation Popup Modal -->
    <div class="popup-overlay" id="confirmPopup">
        <div class="popup-box">
            <div class="check-circle">✓</div>
            <h2>Message Sent!</h2>
            <p>Thank you for reaching out. Your message has been delivered successfully and we will reply to your email soon.</p>
            <div class="popup-actions">
                <button type="button" class="another-btn" onclick="resetForAnother()">Submit Another Response</button>
                <a href="index.html" class="home-btn">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const form = document.getElementById('contactForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');
        const confirmPopup = document.getElementById('confirmPopup');

        messageInput.addEventListener('input', () => {
            charCount.textContent = `${messageInput.value.length}/500 characters`;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';

            const keyVal = document.getElementById('accessKey').value.trim();
            if (keyVal === 'YOUR_ACCESS_KEY_HERE' || keyVal === '') {
                errorMsg.textContent = '⚠️ Error: Please add your Web3Forms Access Key in contact.html first!';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Sending...';

            const formData = new FormData(form);
            const json = JSON.stringify(Object.fromEntries(formData));

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: json
                });
                const result = await response.json();

                if (response.status === 200 && result.success) {
                    form.reset();
                    charCount.textContent = '0/500 characters';
                    confirmPopup.style.display = 'flex';
                } else {
                    errorMsg.textContent = result.message || 'Failed to send message. Check your Access Key.';
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    Send Message`;
            }
        });

        function resetForAnother() {
            confirmPopup.style.display = 'none';
            form.reset();
            charCount.textContent = '0/500 characters';
        }
    </script>
<script src="settings.js"></script>
</body>
</html>
