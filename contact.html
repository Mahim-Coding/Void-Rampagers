<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Void-Rampagers</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-bg: #14161f;
            --gold: #eab308;
            --gold-glow: rgba(234, 179, 8, 0.35);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top, #1e1433 0%, #0b0c10 70%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Navbar */
        header {
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(234, 179, 8, 0.25);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--gold);
            text-decoration: none;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-menu a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-menu a:hover {
            color: var(--gold);
        }

        /* Contact Section */
        .contact-container {
            max-width: 600px;
            width: 100%;
            margin: 50px auto;
            padding: 30px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .contact-container h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .contact-container p {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #1e2230;
            border: 1px solid #3c4266;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .form-btns {
            display: flex;
            gap: 12px;
        }

        .btn-submit {
            flex: 2;
            background: linear-gradient(90deg, #eab308, #f59e0b);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.6);
        }

        .btn-reset {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #3c4266;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-reset:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* Success Message Popup / Notification */
        #resultMsg {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (min-width: 768px) {
            header { padding: 18px 8%; }
            .contact-container { padding: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand">⚔️ VOID-RAMPAGERS</a>
        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="arsenal.html">Arsenal & Wiki</a>
            <a href="community.html">Community</a>
            <a href="contact.html" style="color: var(--gold); font-weight: 600;">Contact</a>
        </nav>
    </header>

    <div class="contact-container">
        <h1>Contact Support</h1>
        <p>Have questions about builds or want to report an issue? Send us a message!</p>
        
        <!-- Web3Forms Contact Form -->
        <form action="https://api.web3forms.com/submit" method="POST" id="contactForm">
            <!-- আপনার Web3Forms Access Key নিচে বসাবেন -->
            <input type="hidden" name="apikey" value="52758410-4656-4edc-9018-441c14438528">

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your name..." required>
            </div>

            <div class="form-group">
                <label>Your Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email..." required>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea name="message" class="form-control" placeholder="Type your message here..." required></textarea>
            </div>

            <div class="form-btns">
                <button type="submit" class="btn-submit">Send Message</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
            
            <div id="resultMsg"></div>
        </form>
    </div>

    <footer>
        <p>© 2026 Void-Rampagers • Fan-made Magic Rampage Portal</p>
    </footer>

    <!-- Web3Forms Ajax Script -->
    <script>
        const form = document.getElementById('contactForm');
        const resultMsg = document.getElementById('resultMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);
            
            resultMsg.style.color = "var(--gold)";
            resultMsg.innerText = "Sending message...";

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let jsonResponse = await response.json();
                if (response.status == 200) {
                    resultMsg.style.color = "#22c55e";
                    resultMsg.innerText = "Success! Your message has been sent.";
                    form.reset();
                } else {
                    resultMsg.style.color = "#ef4444";
                    resultMsg.innerText = jsonResponse.message;
                }
            })
            .catch(error => {
                resultMsg.style.color = "#ef4444";
                resultMsg.innerText = "Something went wrong! Please try again.";
            });
        });
    </script>

    <!-- Settings Script Integration -->
    <script src="settings.js"></script>
</body>
</html>
